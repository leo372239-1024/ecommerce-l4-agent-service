[project]
name = "l4-ecommerce-customer-agent-backend"
version = "0.1.0"
description = "Production-oriented e-commerce customer service agent backend"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ag-ui-protocol>=0.1,<1",
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "casbin>=1,<2",
    "elasticsearch[async]>=9,<10",
    "fastapi>=0.143,<1",
    "fastapi-pagination>=0.12,<1",
    "httpx>=0.27,<1",
    "httpx2>=2.13.1,<3",
    "langchain-core>=1.4.7,<2",
    "langgraph>=1.2.12,<2",
    "langgraph-checkpoint-postgres>=3,<4",
    "mcp>=2.3,<3",
    "orjson>=3.10,<4",
    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
    "opentelemetry-sdk>=1.27,<2",
    "pydantic-settings>=2.6,<3",
    "pgvector>=0.4,<1",
    "psycopg[binary,pool]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "redis[hiredis]>=6,<9",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<28",
    "uvicorn[standard]>=0.34,<1",
    "pyjwt[crypto]>=2.15.1,<3",
]

[dependency-groups]
dev = [
    "pip-audit>=2,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.8,<1",
]

[tool.uv]
default-groups = ["dev"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

