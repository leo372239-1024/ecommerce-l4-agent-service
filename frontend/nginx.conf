resolver 127.0.0.11 valid=5s ipv6=off;
upstream agent_api {
  zone agent_api 64k;
  server api:8000 resolve max_fails=1 fail_timeout=3s;
  keepalive 32;
}
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;
  client_body_timeout 120s;
  # OIDC callbacks carry one-use credentials in query strings; counts come from metrics.
  access_log off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

  location = /healthz { access_log off; return 200 'ok'; }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    error_log /dev/null crit;
    proxy_pass http://agent_api/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Nginx will not replay a POST/PATCH after sending it; non_idempotent is NEVER enabled.
    # Read failover is bounded. Streaming reconnect still uses the durable event cursor.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 5s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 1s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}

