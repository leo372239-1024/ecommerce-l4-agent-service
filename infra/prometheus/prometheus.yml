global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: agent-api
    metrics_path: /api/v1/metrics
    dns_sd_configs:
      - names: ["api"]
        type: A
        port: 8000
        refresh_interval: 5s

